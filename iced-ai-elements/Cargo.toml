[package]
name = "iced_ai_elements"
description = "AI-themed components for iced"
version.workspace = true
edition.workspace = true
authors.workspace = true
# Apache-2.0: port of Vercel's Streamdown (Apache-2.0). Workspace uses MIT.
license = "Apache-2.0"
repository.workspace = true
homepage.workspace = true
categories.workspace = true
keywords.workspace = true
rust-version.workspace = true

[features]
default = ["canvas", "wgpu", "serde"]
canvas = ["iced_widget/canvas"]
wgpu = ["iced_wgpu", "iced_widget/wgpu"]
serde = ["dep:serde"]

[dependencies]
# TODO: Replace umbrella `iced` with specific sub-crates:
#   iced_core -> Color, Element, Length, Size, Point, Rectangle, Vector, Pixels,
#                Radians, alignment, Border, Shadow, mouse, Event,
#                advanced::{layout, renderer, widget::tree, Layout, Shell, Widget}
#   iced_widget -> canvas (behind "canvas" feature)
#   iced_renderer -> Renderer type
# The umbrella re-exports iced::advanced which maps to iced_core internals.
iced = { workspace = true, features = ["advanced"] }
iced_widget.workspace = true
iced_graphics.workspace = true
iced_renderer.workspace = true
iced_wgpu = { workspace = true, optional = true }
iced_winit.workspace = true
iced_futures.workspace = true
serde = { workspace = true, features = ["derive"], optional = true }

[lints]
workspace = true
