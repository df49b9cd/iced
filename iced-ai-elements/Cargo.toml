[package]
name = "iced_ai_elements"
description = "AI-themed components for iced"
version.workspace = true
edition.workspace = true
authors.workspace = true
license = "Apache-2.0"
repository.workspace = true
homepage.workspace = true
categories.workspace = true
keywords.workspace = true
rust-version.workspace = true

[features]
default = ["canvas", "wgpu"]
canvas = ["iced_widget/canvas"]
wgpu = ["iced_wgpu", "iced_widget/wgpu"]

[dependencies]
# TODO: Depend on specific sub-crates (iced_core, iced_widget) instead of
# the umbrella `iced` crate, matching iced's own sub-crate conventions.
iced = { workspace = true, features = ["advanced"] }
iced_widget.workspace = true
iced_graphics.workspace = true
iced_renderer.workspace = true
iced_wgpu = { workspace = true, optional = true }
iced_winit.workspace = true
iced_futures.workspace = true
serde = { workspace = true, features = ["derive"] }

[lints]
workspace = true
